<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斩迹 (BladeTrace) - 只狼弹刀模拟器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Enemy Header HUD -->
        <div id="enemy-hud" class="hud-panel">
            <div class="hud-title">苇名剑圣 (Enemy)</div>
            <div class="bar-label">架势值 (Posture)</div>
            <div class="bar-outer posture-outer">
                <div id="enemy-posture-bar" class="bar-inner posture-inner"></div>
            </div>
        </div>

        <!-- Main Canvas -->
        <canvas id="gameCanvas" width="600" height="650"></canvas>

        <!-- Player Footer HUD -->
        <div id="player-hud" class="hud-panel">
            <div class="bar-label">体力值 (HP)</div>
            <div class="bar-outer hp-outer">
                <div id="player-hp-bar" class="bar-inner hp-inner"></div>
            </div>
            <div class="hud-title">狼 (Player)</div>
        </div>

        <!-- Controls & Config Overlay -->
        <div id="controls-overlay">
            <div class="control-group">
                <label>选择招式：</label>
                <select id="pattern-select">
                    <option value="delayed">苇名流·延迟斩 (单段变奏蓄力)</option>
                    <option value="triple">三连斩·快速变奏 (三段连续斩击)</option>
                    <option value="overhead">跳劈·极速下斩 (高抛落刀)</option>
                </select>
            </div>
            <div class="control-group">
                <label>弹反难度：</label>
                <select id="window-select">
                    <option value="220">简单 (220ms 判定窗)</option>
                    <option value="150" selected>修罗 / 标准 (150ms 判定窗)</option>
                    <option value="90">苦难 / 极难 (90ms 判定窗)</option>
                </select>
            </div>
            <button id="btn-attack" class="action-btn">敌方发起攻击 [Space / 点击]</button>
            <button id="btn-parry" class="parry-btn">弹 反 (PARRY)</button>
        </div>

        <!-- Deathblow Overlay -->
        <div id="deathblow-overlay" class="hidden">
            <div class="deathblow-kanji">忍殺</div>
            <div class="deathblow-sub">处决！按 [空格键] 或 [点击] 给予终结一击</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
