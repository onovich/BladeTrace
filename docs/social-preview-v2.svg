<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">BladeTrace social preview</title>
  <desc id="description">A warm dark technical composition for BladeTrace, showing a multi-segment Bezier attack path from an enemy blade origin to a fixed player hurtbox target.</desc>
  <defs>
    <radialGradient id="background" cx="42%" cy="38%" r="78%">
      <stop offset="0" stop-color="#252019"/>
      <stop offset="0.62" stop-color="#12100e"/>
      <stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="posture" x1="0" x2="1">
      <stop offset="0" stop-color="#d97724"/>
      <stop offset="1" stop-color="#ff3b00"/>
    </linearGradient>
    <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="emberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="stageClip">
      <rect x="720" y="72" width="488" height="496" rx="0"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="#0d0d0d"/>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect x="48" y="48" width="1184" height="544" fill="none" stroke="#3d352b" stroke-width="2"/>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="120" fill="#9a8568" font-family="Consolas, monospace" font-size="16" letter-spacing="2.8">BEZIER DEFLECTION PROTOTYPE</text>
    <text x="72" y="222" fill="#e6c894" font-size="88" font-weight="700" letter-spacing="-3">BladeTrace</text>
    <text x="77" y="264" fill="#c9a063" font-size="25" font-weight="600" letter-spacing="5">斩迹 · 弹刀轨迹模拟器</text>

    <line x1="74" y1="310" x2="596" y2="310" stroke="#554433" stroke-width="2"/>
    <text x="72" y="362" fill="#e0d8c3" font-size="30" font-weight="600">Design and test deflection rhythm</text>
    <text x="72" y="402" fill="#b0a494" font-size="25">on multi-segment Bezier attack paths.</text>

    <g font-family="Consolas, Microsoft YaHei, monospace" font-size="17" letter-spacing="0.6">
      <circle cx="82" cy="472" r="5" fill="#c9a063"/>
      <text x="100" y="478" fill="#d7c4a5">MULTI-SEGMENT PATH</text>
      <circle cx="82" cy="510" r="5" fill="#d97724"/>
      <text x="100" y="516" fill="#d7c4a5">PER-SEGMENT EASING</text>
      <circle cx="82" cy="548" r="5" fill="#ff4500"/>
      <text x="100" y="554" fill="#d7c4a5">PRECISION PARRY WINDOW</text>
    </g>
  </g>

  <g clip-path="url(#stageClip)" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="720" y="72" width="488" height="496" fill="#11100e" stroke="#554433" stroke-width="2"/>
    <text x="748" y="110" fill="#9a8568" font-family="Consolas, monospace" font-size="14" letter-spacing="1.4">ATTACK PATTERN / DELAYED SLASH</text>
    <line x1="960" y1="142" x2="960" y2="510" stroke="#c9a063" stroke-opacity="0.13" stroke-width="2"/>

    <g stroke="#b0a494" stroke-opacity="0.28" stroke-width="2">
      <line x1="960" y1="166" x2="810" y2="214"/>
      <line x1="838" y1="390" x2="790" y2="330"/>
      <line x1="838" y1="390" x2="885" y2="452"/>
      <line x1="960" y1="500" x2="930" y2="480"/>
    </g>

    <g fill="#c9a063">
      <circle cx="810" cy="214" r="5"/>
      <circle cx="790" cy="330" r="5"/>
      <circle cx="885" cy="452" r="5"/>
      <circle cx="930" cy="480" r="5"/>
    </g>

    <path d="M 960 166 C 810 214 790 330 838 390" fill="none" stroke="#c9a063" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
    <path d="M 838 390 C 885 452 930 480 960 500" fill="none" stroke="#ff4500" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 7" filter="url(#emberGlow)"/>

    <g fill="#c9a063" filter="url(#goldGlow)">
      <circle cx="960" cy="166" r="13"/>
    </g>
    <text x="915" y="145" fill="#e0d8c3" font-size="15" font-weight="600">敌方剑锋</text>

    <g>
      <circle cx="960" cy="500" r="31" fill="none" stroke="#c9a063" stroke-width="3" filter="url(#goldGlow)"/>
      <circle cx="960" cy="500" r="8" fill="#ff4500" filter="url(#emberGlow)"/>
      <text x="912" y="545" fill="#e0d8c3" font-size="15" font-weight="600">玩家受击区</text>
    </g>

    <g font-family="Consolas, Microsoft YaHei, monospace">
      <rect x="748" y="270" width="120" height="30" fill="#16120e" stroke="#554433"/>
      <text x="762" y="291" fill="#c9a063" font-size="14">WINDUP · 900ms</text>
      <rect x="1000" y="418" width="158" height="30" fill="#1d0d09" stroke="#8b3b24"/>
      <text x="1013" y="439" fill="#ffb07d" font-size="14">PARRY · 150ms</text>
      <text x="858" y="420" fill="#ff9864" font-size="14">STRIKE · 220ms</text>
    </g>

    <g>
      <text x="748" y="536" fill="#9a8568" font-family="Consolas, monospace" font-size="13" letter-spacing="1">PERFECT DEFLECT</text>
      <rect x="748" y="546" width="230" height="10" fill="#1f1b17" stroke="#4a3e2f"/>
      <rect x="749" y="547" width="57" height="8" fill="url(#posture)"/>
      <text x="996" y="555" fill="#e6c894" font-family="Consolas, monospace" font-size="13">POSTURE +25%</text>
    </g>
  </g>

  <text x="72" y="574" fill="#806f5a" font-family="Consolas, monospace" font-size="14" letter-spacing="1.4">STATIC BROWSER PROTOTYPE · DATA-DRIVEN ATTACK RHYTHM</text>
</svg>

